<!doctype html>
<html lang="en">
<head>
  <meta id="test-charset" charset="utf-8">
  <meta id="test-viewport" name="viewport" content="width=device-width, initial-scale=1">
  <meta id="test-robots" name="robots" content="noindex, nofollow">
  <title id="test-title">Userscript test</title>
  <style id="test-style">
    :root { color-scheme: light dark; font: 16px/1.55 system-ui, sans-serif; }
    body { margin: 0; }
    main { max-width: 42rem; margin: 10vh auto; padding: 0 1.25rem 2rem; }
    h1 { line-height: 1.1; }
    section { border: 1px solid GrayText; border-radius: .6rem; padding: 0 1rem; }
    ul:empty { display: none; }
  </style>
  <template id="test-layout">
    <main>
      <h1>Userscript test</h1>
      <p>This page watches for browser-visible injection. Results stay in this tab.</p>
      <section aria-label="Detection results">
        <p><strong role="status">Starting scan…</strong></p>
        <ul aria-label="Signals"></ul>
      </section>
      <p>Browser extensions, developer tools, and userscripts can leave similar traces.
        A script that runs in isolation and leaves the page untouched may be invisible.</p>
    </main>
  </template>
  <script>
    (() => {
      const owned = new WeakSet([
        document.currentScript,
        document.getElementById("test-charset"),
        document.getElementById("test-viewport"),
        document.getElementById("test-robots"),
        document.getElementById("test-title"),
        document.getElementById("test-style"),
        document.getElementById("test-layout"),
      ].filter(Boolean));
      const ownStyle = document.getElementById("test-style");
      const originalRules = readRules();
      const signals = new Set();
      const extensionUrl = /^(chrome|moz|safari-web|safari)-extension:/i;
      let status;
      let list;
      let rendered = 0;

      function readRules() {
        return Array.from(ownStyle.sheet?.cssRules ?? [], rule => rule.cssText).join("\n");
      }

      function isOwned(element) {
        return owned.has(element) || element === document.documentElement ||
          element === document.head || element === document.body ||
          (element.localName === "noscript" && element === document.getElementById("test-noscript"));
      }

      function describeElement(element) {
        const id = element.id ? `id=${JSON.stringify(element.id)}` : "no ID";
        return `<${element.localName}> element (${id})`;
      }

      function inspectElement(element) {
        if (isOwned(element)) {
          if (element.shadowRoot) signals.add(`Unexpected open shadow root on a page ${describeElement(element)}.`);
          return;
        }

        const tag = element.localName;
        if (Array.from(element.attributes).some(attribute => extensionUrl.test(attribute.value.trim()))) {
          signals.add(`Extension URL on an unexpected ${describeElement(element)}.`);
        }
        if (["script", "style", "link", "iframe"].includes(tag)) {
          signals.add(`Unexpected ${describeElement(element)}.`);
          return;
        }
        const position = element.isConnected ? getComputedStyle(element).position : element.style?.position;
        const isOpenPopup = element.matches("dialog[open]") ||
          (element.hasAttribute("popover") && element.getClientRects().length > 0);
        if (position === "fixed" || position === "sticky" || isOpenPopup) {
          signals.add(`Unexpected overlay-like ${describeElement(element)}.`);
        } else {
          signals.add(`Unexpected ${describeElement(element)}.`);
        }
      }

      function render() {
        if (!status || rendered === signals.size) return;
        for (const signal of Array.from(signals).slice(rendered, 30)) {
          const item = document.createElement("li");
          owned.add(item);
          item.textContent = signal;
          list.append(item);
        }
        if (rendered <= 30 && signals.size > 30) {
          const item = document.createElement("li");
          owned.add(item);
          item.textContent = "Additional signals omitted.";
          list.append(item);
        }
        rendered = signals.size;
        status.data = "Possible injection observed";
      }

      const observer = new MutationObserver(records => {
        for (const record of records) {
          if (record.type === "attributes") {
            if (isOwned(record.target)) {
              signals.add(`Attributes changed on a page ${describeElement(record.target)}.`);
            } else {
              inspectElement(record.target);
            }
            continue;
          }
          for (const node of record.addedNodes) {
            if (node.nodeType !== Node.ELEMENT_NODE) continue;
            inspectElement(node);
            node.querySelectorAll("*").forEach(inspectElement);
          }
          for (const node of record.removedNodes) {
            if (node.nodeType === Node.ELEMENT_NODE && isOwned(node)) {
              signals.add(`Page ${describeElement(node)} removed.`);
            }
          }
        }
        render();
      });
      observer.observe(document, { subtree: true, childList: true, attributes: true });

      function checkPageApis(frame) {
        const clean = frame.contentWindow;
        const describe = clean.Object.getOwnPropertyDescriptor;
        const source = clean.Function.prototype.toString;
        const checks = [
          [window, clean, "fetch", "window"],
          [window, clean, "getComputedStyle", "window"],
          [window, clean, "MutationObserver", "window"],
          [Function.prototype, clean.Function.prototype, "toString", "Function.prototype"],
          [Document.prototype, clean.Document.prototype, "createElement", "Document.prototype"],
          [Document.prototype, clean.Document.prototype, "querySelectorAll", "Document.prototype"],
          [Node.prototype, clean.Node.prototype, "appendChild", "Node.prototype"],
          [Element.prototype, clean.Element.prototype, "attachShadow", "Element.prototype"],
          [XMLHttpRequest.prototype, clean.XMLHttpRequest.prototype, "open", "XMLHttpRequest.prototype"],
          [EventTarget.prototype, clean.EventTarget.prototype, "addEventListener", "EventTarget.prototype"],
        ];
        for (const [page, baseline, name, label] of checks) {
          const expected = describe(baseline, name)?.value;
          if (typeof expected !== "function") continue;
          const actual = describe(page, name)?.value;
          if (typeof actual !== "function" || source.call(actual) !== source.call(expected)) {
            signals.add(`Page API differs from browser baseline: ${label}.${name}.`);
          }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const content = document.getElementById("test-layout").content.cloneNode(true);
        content.querySelectorAll("*").forEach(element => owned.add(element));
        status = content.querySelector("[role=status]").firstChild;
        list = content.querySelector("ul");
        const frame = document.createElement("iframe");
        frame.hidden = true;
        frame.title = "Browser API baseline";
        owned.add(frame);
        owned.add(document.body);
        document.body.append(content, frame);

        function scan() {
          document.querySelectorAll("*").forEach(inspectElement);
          if (readRules() !== originalRules) {
            signals.add(`Unexpected stylesheet rules in ${describeElement(ownStyle)}.`);
          }
          if (document.adoptedStyleSheets?.length) {
            signals.add("Unexpected document-adopted stylesheet (no DOM element).");
          }
          for (const element of [document.documentElement, document.body]) {
            for (const pseudo of ["::before", "::after"]) {
              if (!["none", "normal"].includes(getComputedStyle(element, pseudo).content)) {
                signals.add(`Unexpected CSS content in ${pseudo} on ${describeElement(element)}.`);
              }
            }
          }
          if (performance.getEntriesByType("resource").some(entry => extensionUrl.test(entry.name))) {
            signals.add("Extension URL in the resource timing log.");
          }
          for (const name of ["GM_info", "GM", "GM_getValue", "GM_addStyle", "unsafeWindow"]) {
            if (Object.hasOwn(window, name)) signals.add(`Userscript marker visible on the page: ${name}.`);
          }
          try {
            checkPageApis(frame);
          } catch {
            signals.add("Browser API comparison unavailable.");
          }
          render();
        }

        status.data = "No visible signals so far";
        scan();
        setInterval(scan, 1000);
      }, { once: true });
    })();
  </script>
</head>
<body>
  <noscript id="test-noscript">Enable JavaScript to run the userscript test.</noscript>
</body>
</html>
