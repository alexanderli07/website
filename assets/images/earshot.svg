<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Earshot dashboard: a live waveform detects a smoke alarm and fires LED, vibration and push alerts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141024"/>
      <stop offset="1" stop-color="#0a0816"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g stroke="#231d3d" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>
  <text x="80" y="70" fill="#7d74a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">EARSHOT · LIVE FEED · ON-DEVICE</text>

  <!-- the waveform: quiet room, then the alarm burst, then quiet -->
  <g stroke="#4f4880" stroke-width="3" stroke-linecap="round">
    <line x1="90"  y1="290" x2="90"  y2="310"/><line x1="115" y1="285" x2="115" y2="315"/>
    <line x1="140" y1="292" x2="140" y2="308"/><line x1="165" y1="280" x2="165" y2="320"/>
    <line x1="190" y1="288" x2="190" y2="312"/><line x1="215" y1="294" x2="215" y2="306"/>
    <line x1="240" y1="283" x2="240" y2="317"/><line x1="265" y1="290" x2="265" y2="310"/>
  </g>
  <g stroke="url(#hot)" stroke-width="7" stroke-linecap="round">
    <line x1="300" y1="240" x2="300" y2="360"/><line x1="330" y1="190" x2="330" y2="410"/>
    <line x1="360" y1="150" x2="360" y2="450"/><line x1="390" y1="205" x2="390" y2="395"/>
    <line x1="420" y1="165" x2="420" y2="435"/><line x1="450" y1="225" x2="450" y2="375"/>
    <line x1="480" y1="185" x2="480" y2="415"/><line x1="510" y1="250" x2="510" y2="350"/>
  </g>
  <g stroke="#4f4880" stroke-width="3" stroke-linecap="round">
    <line x1="545" y1="288" x2="545" y2="312"/><line x1="570" y1="293" x2="570" y2="307"/>
    <line x1="595" y1="284" x2="595" y2="316"/><line x1="620" y1="291" x2="620" y2="309"/>
  </g>

  <!-- the detection card -->
  <g>
    <rect x="680" y="170" width="440" height="150" rx="10" fill="#1b1533" stroke="#3b3168" stroke-width="2"/>
    <circle cx="722" cy="222" r="14" fill="#ef4444"/>
    <text x="752" y="231" fill="#f3eede" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="600">SMOKE ALARM</text>
    <text x="752" y="284" fill="#8d84b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">urgency HIGH · conf 0.94 · 0.8s</text>
  </g>

  <!-- the fan-out: three alerts firing -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" text-anchor="middle">
    <circle cx="760" cy="430" r="34" fill="none" stroke="#ef4444" stroke-width="4"/>
    <circle cx="760" cy="430" r="16" fill="#ef4444"/>
    <text x="760" y="512" fill="#8d84b8">LED</text>
    <g stroke="#f59e0b" stroke-width="4" fill="none">
      <circle cx="900" cy="430" r="16" fill="#f59e0b" stroke="none"/>
      <path d="M866 414 q-10 16 0 32"/><path d="M934 414 q10 16 0 32"/>
      <path d="M850 402 q-18 28 0 56"/><path d="M950 402 q18 28 0 56"/>
    </g>
    <text x="900" y="512" fill="#8d84b8">BUZZ</text>
    <g>
      <rect x="1016" y="398" width="46" height="66" rx="9" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="1039" cy="410" r="4" fill="#38bdf8"/>
    </g>
    <text x="1039" y="512" fill="#8d84b8">PUSH</text>
  </g>
</svg>
